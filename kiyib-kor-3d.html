<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiyib ko'r 3D — do'kon uchun jonli kiyim xonasi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#e6eaef;--ink:#17202b;--mute:#5d6877;--line:#d5dbe3;--acc:#2457f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
.stage{position:relative;background:#0e1218;border-radius:14px 14px 0 0;overflow:hidden;display:grid}
.stage canvas{grid-area:1/1;width:100%;height:auto;aspect-ratio:16/9;transform:scaleX(-1)}
video{position:absolute;width:1px;height:1px;opacity:0}
.msg{grid-area:1/1;z-index:2;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#cfd6e0;text-align:center;padding:24px}
.msg[hidden]{display:none}.msg p{margin:0;max-width:40ch}
button{font:inherit;cursor:pointer}
.primary{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#161b23;color:#9aa5b4;font-size:13px;border-radius:0 0 14px 14px}
.bar button{background:#232b37;color:#e6ebf2;border:0;border-radius:8px;padding:7px 14px}
aside{background:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:20px;align-self:start}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:15px}.sub{margin:4px 0 0;color:var(--mute);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:250px;overflow:auto}
.tile{background:#f0f2f6;border:2px solid transparent;border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;color:var(--mute)}
.tile i{display:block;height:50px;margin-bottom:3px;background:center/contain no-repeat}
.tile[aria-pressed=true]{border-color:var(--acc);color:var(--ink)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:2px}
label{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--acc)}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);cursor:pointer;font-size:14px;grid-template-columns:none}
.drop:hover{border-color:var(--acc)}.drop b{display:block;color:var(--ink)}.drop input{display:none}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section>
  <div class="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <canvas id="g" width="1280" height="720"></canvas>
    <video id="v" playsinline muted></video>
    <div class="msg" id="msg"><p>Kamerani yoqing. Yelka va ko'kragingiz ko'rinib tursin.</p><button class="primary" id="start">Kamerani yoqish</button></div>
  </div>
  <div class="bar"><span id="status">Kamera o'chiq</span><button id="snap">Suratga olish</button></div>
</section>
<aside>
  <div><h1>Kiyib ko'r 3D</h1><p class="sub">Kiyim 3D shaklda tanangizga avtomatik o'rnashadi.</p></div>
  <div><h2>Katalog</h2><div class="tiles" id="tiles"></div></div>
  <div><h2>Rang</h2><div class="sw" id="sw"></div></div>
  <div><h2>Moslash</h2>
    <label>Kattalik <input type="range" id="scale" min="0.7" max="1.5" step="0.01" value="1"></label>
    <label>Uzunlik <input type="range" id="len" min="0.7" max="1.6" step="0.01" value="1"></label>
    <label>Balandlik <input type="range" id="dy" min="-30" max="30" step="1" value="0"></label></div>
  <label class="drop"><b>Katalogga yangi kiyim qo'shish</b>Kiyim rasmi (old tomondan). Fon avtomatik olib tashlanadi va rasm 3D shaklga o'raladi.
    <input type="file" id="file" accept="image/*" multiple></label>
</aside>
</main>

<script type="module">
import {PoseLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=s=>document.querySelector(s), V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const cv=$('#c'),ctx=cv.getContext('2d'),vid=$('#v'),msg=$('#msg'),st=$('#status');
let W=1280,H=720;

/* ---------- 3D sahna ---------- */
const gl=new THREE.WebGLRenderer({canvas:$('#g'),alpha:true,antialias:true,preserveDrawingBuffer:true});
gl.setClearColor(0,0);
const scene=new THREE.Scene(); let cam;
scene.add(new THREE.HemisphereLight(0xffffff,0x6a7788,.95));
const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(-300,500,800); scene.add(dl);
function setSize(w,h){W=w;H=h;cv.width=w;cv.height=h;gl.setSize(w,h,false);
  cam=new THREE.OrthographicCamera(0,w,h,0,1,3000);cam.position.z=1500;
  document.querySelectorAll('.stage canvas').forEach(c=>c.style.aspectRatio=w+'/'+h);}
setSize(W,H);

function mkTube(R,N){const g=new THREE.BufferGeometry(),n=(R+1)*(N+1),idx=[],uv=new Float32Array(n*2);
  for(let i=0;i<=R;i++)for(let j=0;j<=N;j++){const k=i*(N+1)+j;uv[k*2]=.5+.5*Math.sin(j/N*6.2832);uv[k*2+1]=1-i/R;
    if(i<R&&j<N){idx.push(k,k+N+1,k+1,k+1,k+N+1,k+N+2);}}
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);g.userData={R,N};return g;}
function ring(g,i,c,A,B,ra,rb){const N=g.userData.N,p=g.attributes.position;
  for(let j=0;j<=N;j++){const t=j/N*6.2832,s=Math.sin(t)*ra,k=Math.cos(t)*rb;
    p.setXYZ(i*(N+1)+j,c.x+A.x*s+B.x*k,c.y+A.y*s+B.y*k,c.z+A.z*s+B.z*k);}}
function done(g){g.attributes.position.needsUpdate=true;g.computeVertexNormals();g.computeBoundingSphere();}

/* ---------- Katalog ---------- */
const COLORS=['#161616','#f4f4f2','#1f3a5f','#b3262d','#2f6b4f','#e0a526','#7a5cc4'];
const BASE=[
 {name:"Futbolka",sl:.38,len:1,loose:1.05},{name:"Uzun yenglik",sl:1,len:1.05,loose:1},
 {name:"Mayka",sl:0,len:.95,loose:.85},{name:"Xudi",sl:1,len:1.15,loose:1.25},{name:"Kurtka",sl:1,len:1,loose:1.15}];
let items=BASE.map(b=>({...b})),cur=0,color=COLORS[2],group=null,tex=null;
try{JSON.parse(localStorage.getItem('kiyim_katalog')||'[]').forEach(x=>items.push({...x,photo:true}));}catch{}

function select(i){cur=i;const g=items[i];
  if(group)scene.remove(group);group=new THREE.Group();
  const mat=g.photo?new THREE.MeshStandardMaterial({map:new THREE.TextureLoader().load(g.src),transparent:true,alphaTest:.35,side:THREE.DoubleSide,roughness:.9})
    :new THREE.MeshStandardMaterial({color,roughness:.85,side:THREE.DoubleSide});
  g.mat=mat;g.torso=new THREE.Mesh(mkTube(14,28),mat);group.add(g.torso);g.torso.frustumCulled=false;
  g.slv=[0,1].map(()=>{const m=new THREE.Mesh(mkTube(8,16),mat);m.frustumCulled=false;m.visible=!g.photo&&g.sl>0;group.add(m);return m;});
  scene.add(group);tiles();}
function tiles(){const t=$('#tiles');t.innerHTML='';
  items.forEach((g,i)=>{const b=document.createElement('button');b.className='tile';b.setAttribute('aria-pressed',i===cur);
    b.innerHTML='<i></i><span></span>';b.querySelector('span').textContent=g.name;
    const ic=b.querySelector('i');if(g.photo)ic.style.backgroundImage=`url(${g.src})`;else{ic.style.background=color;ic.style.borderRadius='8px';ic.style.margin='0 14px 3px';}
    b.onclick=()=>select(i);t.appendChild(b);});}
function swatches(){const s=$('#sw');s.innerHTML='';COLORS.forEach(c=>{const b=document.createElement('button');
  b.style.background=c;b.setAttribute('aria-label','Rang '+c);b.setAttribute('aria-pressed',c===color);
  b.onclick=()=>{color=c;if(!items[cur].photo)items[cur].mat.color.set(c);swatches();tiles();};s.appendChild(b);});}

/* Rasmdan fonni olib tashlash va kesish */
function keyOut(img){const m=Math.min(1,600/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*m),h=Math.round(img.naturalHeight*m),c=document.createElement('canvas');
  c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h),a=d.data;
  if(a[3]>250){const bg=[a[0],a[1],a[2]],seen=new Uint8Array(w*h),q=[];
    const near=p=>Math.abs(a[p*4]-bg[0])+Math.abs(a[p*4+1]-bg[1])+Math.abs(a[p*4+2]-bg[2])<60;
    for(let i=0;i<w;i++)q.push(i,(h-1)*w+i);for(let j=0;j<h;j++)q.push(j*w,j*w+w-1);
    while(q.length){const p=q.pop();if(seen[p]||!near(p))continue;seen[p]=1;a[p*4+3]=0;const px=p%w;
      if(px>0)q.push(p-1);if(px<w-1)q.push(p+1);if(p>=w)q.push(p-w);if(p<w*(h-1))q.push(p+w);}
    x.putImageData(d,0,0);}
  let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)if(a[(y*w+xx)*4+3]>10){x0=Math.min(x0,xx);x1=Math.max(x1,xx);y0=Math.min(y0,y);y1=Math.max(y1,y);}
  if(x1<=x0||y1<=y0)return c.toDataURL();const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png');}
$('#file').onchange=e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const src=keyOut(im);items.push({name:f.name.replace(/\.[^.]+$/,'').slice(0,12),photo:true,src,sl:0,len:1.1,loose:1.5});
  try{localStorage.setItem('kiyim_katalog',JSON.stringify(items.filter(x=>x.photo&&x.src).map(({name,src,len,loose})=>({name,src,len,loose,sl:0})))); }catch{}
  select(items.length-1);};im.src=r.result;};r.readAsDataURL(f);});e.target.value='';};

/* ---------- Poza kuzatuvi (AI) ---------- */
let lm=null,P=null,lastT=-1,miss=0,vis={};
const IDX=[11,12,13,14,15,16,23,24];
async function initPose(){st.textContent='AI model yuklanmoqda…';
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const mp="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task";
  const mk=d=>PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:mp,delegate:d},runningMode:'VIDEO',numPoses:1});
  try{lm=await mk('GPU');}catch{lm=await mk('CPU');}}
function track(L){const raw={};IDX.forEach(i=>raw[i]=V3(L[i].x*W,(1-L[i].y)*H,-L[i].z*W));
  vis={hips:Math.min(L[23].visibility,L[24].visibility)>.3};
  if(!P)P=raw;else IDX.forEach(i=>P[i].lerp(raw[i],.5));}

/* ---------- Kiyimni tanaga avtomatik joylash ---------- */
function fit(g){
  const sc=+$('#scale').value,ln=+$('#len').value*g.len,dy=+$('#dy').value;
  const S=P[11].clone().add(P[12]).multiplyScalar(.5),sw=P[11].distanceTo(P[12]);
  const u=P[11].clone().sub(P[12]).normalize();let s,tl;
  if(vis.hips){const Hc=P[23].clone().add(P[24]).multiplyScalar(.5);tl=S.distanceTo(Hc);s=Hc.sub(S).normalize();}
  else{s=V3(u.y,-u.x,0).normalize();tl=sw*1.4;}
  const v=new THREE.Vector3().crossVectors(s,u).normalize(),half=sw/2*sc*g.loose;
  const R=14;
  for(let i=0;i<=R;i++){const t=i/R,c=S.clone().addScaledVector(s,tl*(t*ln*1.05-.06+dy/100));
    let a,b;
    if(g.photo){a=half*(g.loose>1?1:1);b=sw*.14*sc;}
    else{const p=t<.12?.22+.78*Math.sin(t/.12*1.5708):1-.1*((t-.12)/.88);a=half*1.1*p;b=sw*.3*sc*g.loose;}
    ring(g.torso.geometry,i,c,u,v,a,b);}
  done(g.torso.geometry);
  if(g.photo||g.sl<=0)return;
  [[11,13,15],[12,14,16]].forEach((ids,k)=>{
    const A0=P[ids[0]],A1=P[ids[1]],A2=P[ids[2]],L1=A0.distanceTo(A1),L2=A1.distanceTo(A2),RR=8,geo=g.slv[k].geometry;
    for(let i=0;i<=RR;i++){const d=i/RR*g.sl*(L1+L2);let c,dir;
      if(d<=L1){c=A0.clone().lerp(A1,d/L1);dir=A1.clone().sub(A0);}else{c=A1.clone().lerp(A2,(d-L1)/L2);dir=A2.clone().sub(A1);}
      dir.normalize();const e1=new THREE.Vector3().crossVectors(dir,V3(0,0,1)).normalize(),e2=new THREE.Vector3().crossVectors(dir,e1);
      const r=sw*.17*sc*g.loose*(1-.2*i/RR);ring(geo,i,c,e1,e2,r,r);}
    done(geo);});
}

/* ---------- Asosiy sikl ---------- */
let started=false;
function frame(){requestAnimationFrame(frame);if(!started||vid.readyState<2)return;
  if(lm&&vid.currentTime!==lastT){lastT=vid.currentTime;const r=lm.detectForVideo(vid,performance.now()),L=r.landmarks[0];
    if(L&&Math.min(L[11].visibility,L[12].visibility)>.5){miss=0;track(L);st.textContent='Jonli · 3D';}
    else if(++miss>15){P=null;st.textContent="Yelkangiz ko'rinmayapti — biroz uzoqroq turing";}}
  ctx.drawImage(vid,0,0,W,H);
  const g=items[cur];if(group)group.visible=!!P;
  if(P&&g&&g.torso)fit(g);
  gl.render(scene,cam);}

$('#start').onclick=async()=>{msg.querySelector('p').textContent='Kamera ochilmoqda…';
  try{vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
    await vid.play();setSize(vid.videoWidth,vid.videoHeight);msg.hidden=true;started=true;
    if(!lm)await initPose();st.textContent='Jonli · 3D';
  }catch(e){msg.hidden=false;msg.querySelector('p').textContent='Kamera yoki AI model ochilmadi: '+(e.message||e)+'. Kameraga ruxsat bering va internetni tekshiring.';}};
$('#snap').onclick=()=>{const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
  x.translate(W,0);x.scale(-1,1);x.drawImage(cv,0,0);x.drawImage(gl.domElement,0,0);
  o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kiyib-kordim.png';a.click();});};

swatches();select(0);frame();
</script>
</body>
</html>
